name: "Airport Checkin"

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "2 17 * * *"   # 中国时间每天 01:02（UTC+8）

  workflow_dispatch:

env:
  RUN_ENV: "prod"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Random sleep (only for schedule)
        if: github.event_name == 'schedule'
        run: |
          sleep $(shuf -i 10-100 -n 1)

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run main program
        env:
          SCKEY: ${{ secrets.SCKEY }}
          TOKEN: ${{ secrets.TOKEN }}
          QQTOKEN: ${{ secrets.QQTOKEN }}
          QQ: ${{ secrets.QQ }}
          EMAIL: ${{ vars.EMAIL }}
          PASSWD: ${{ vars.PASSWD }}
        run: |
          python3 ./main.py
